[[mods]]
modId="perfcore"
version="1.1.0"
displayName="PerfCore"
authors="Andrey"
description='''
Небольшой мод производительности для Minecraft 26.3 / Forge 66.

• реже тикает ИИ мобов, рядом с которыми нет игроков;
• ограничивает количество и дальность частиц;
• отсекает отрисовку далёких живых сущностей;
• адаптирует дальность прорисовки под FPS и восстанавливает настройку
  игрока после выхода из мира;
• заранее выделяет динамические GPU-буферы, убирая их постоянное
  пересоздание и спам «Resizing ...» в логе;
• размазывает массовые взрывы динамита по тикам, убирая фризы от цепных
  реакций;
• ускоряет создание нового мира за счёт меньшей области поиска спавна.

Новое в 1.1.0: оптимизация взрывов динамита и ускоренное создание мира.

Все настройки находятся в config/perfcore-*.toml и меняются без перезапуска.
'''

[[dependencies.perfcore]]
    modId="forge"
    mandatory=true
    versionRange="[66,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.perfcore]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.3,26.4)"
    ordering="NONE"
    side="BOTH"
