[[mods]]
modId="perfcore"
version="1.3.0"
displayName="PerfCore"
authors="Puging_Pug"
description='''
Lightweight optimization mod for Minecraft 26.3 / Forge 66.

Features:
- Throttles AI of mobs far from players;
- Freezes idle items and XP orbs far from players without breaking despawn timers;
- Limits particles and ambient sounds;
- Culls distant living entities;
- Adapts render distance to FPS and restores player settings;
- Pre-allocates dynamic GPU buffers to avoid "Resizing..." log spam;
- Spreads TNT explosions across ticks to remove chain-reaction freezes;
- Speeds up world creation by reducing the spawn search area.

1.3.0: fixed item/XP freezing, sounds and render distance bugs; removed unsafe light cache, path cache and chunk culling.

All settings are in config/perfcore-*.toml and can be changed without restart.
'''

[[dependencies.perfcore]]
    modId="forge"
    mandatory=true
    versionRange="[66,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.perfcore]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.3,26.4)"
    ordering="NONE"
    side="BOTH"
