plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.3.0'
group = 'com.andrey.perfcore'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'perfcore'
        }

        register('client') {
            args '--mixin.config', 'perfcore.mixins.json'
        }

        register('server') {
            args '--nogui', '--mixin.config', 'perfcore.mixins.json'
        }

        register('gameTestServer') {
            args '--mixin.config', 'perfcore.mixins.json'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'perfcore', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.2')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

jar {
    manifest {
        attributes(
                'MixinConfigs': 'perfcore.mixins.json',
                'Specification-Title': 'PerfCore',
                'Specification-Vendor': 'Andrey',
                'Specification-Version': '1',
                'Implementation-Title': 'PerfCore',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Andrey'
        )
    }
}
